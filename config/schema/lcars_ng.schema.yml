# Schema for the configuration files of the LCARS-NG theme.

lcars_ng.settings:
  type: theme_settings
  label: 'LCARS-NG settings'
  mapping:
    front_page_login:
      type: boolean
      label: 'Login panel on the front page for anonymous visitors'
    navigation_scheme:
      type: string
      label: 'Colors of the Navigation module: dark, light, or as the system'
      constraints:
        Choice:
          - dark
          - light
          - auto
    contrast:
      type: string
      label: 'Contrast: as the system, standard, medium or high'
      constraints:
        Choice:
          - system
          - standard
          - medium
          - high
    generated_user_pictures:
      type: boolean
      label: 'Patterns made from the account for users without a picture'
    collapse_module_packages:
      type: boolean
      label: 'Packages on Extend, sections of theme settings, basic site settings and Mail System, groups of meta tags start collapsed'
    content_type_in_title_bar:
      type: sequence
      label: 'Content types whose page shows the type in the title bar and the title above the content'
      sequence:
        type: string
        label: 'Content type'
